<title>Agentic AI Readiness Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: an engineer's spec sheet — questionnaire on the left, live readout pinned on the right, full brief below */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#101924; --muted:#566373; --line:#D2D9E2;
  --accent:#A3550E; --accent-ink:#FFFFFF; --accent-soft:#F7E8D7;
  --good:#1D7448; --good-soft:#DCEFE3; --warn:#8F5E00; --warn-soft:#F6EACF; --crit:#B0271F; --crit-soft:#F7DFDC;
  --f-display:"Archivo","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1017; --surface:#111A24; --surface-2:#17222E; --ink:#E5EAF0; --muted:#8C99A9; --line:#243244;
    --accent:#E4A15A; --accent-ink:#1B1207; --accent-soft:#33261A;
    --good:#5EC291; --good-soft:#15301F; --warn:#E2B04E; --warn-soft:#33280F; --crit:#F0837A; --crit-soft:#3A1A18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1017; --surface:#111A24; --surface-2:#17222E; --ink:#E5EAF0; --muted:#8C99A9; --line:#243244;
  --accent:#E4A15A; --accent-ink:#1B1207; --accent-soft:#33261A;
  --good:#5EC291; --good-soft:#15301F; --warn:#E2B04E; --warn-soft:#33280F; --crit:#F0837A; --crit-soft:#3A1A18;
  color-scheme:dark;
}
html[dir="rtl"]{
  --f-display:"IBM Plex Sans Arabic","Archivo",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{line-height:1.7}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.mono-label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
html[dir="rtl"] .mono-label{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-size:12.5px;font-weight:600}

/* top bar */
.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:10px}
.topbar p{margin:0;font-size:13px;color:var(--muted);min-width:0;flex:1 1 320px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-inline-end:6px;color:var(--ink)}
html[dir="rtl"] .tag{font-family:var(--f-body);letter-spacing:0;font-size:11.5px}
.top-actions{display:flex;flex-wrap:wrap;gap:8px}

/* buttons */
.btn{font:inherit;font-size:13.5px;font-weight:600;line-height:1.2;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.outline{border-color:var(--accent);color:var(--accent);background:transparent}
.btn.ghost{background:transparent}

/* hero */
.hero{padding-block:44px 26px;display:grid;gap:14px}
.eyebrow{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
html[dir="rtl"] .eyebrow{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-size:13.5px;font-weight:600}
h1{margin:0;font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:clamp(38px,6.4vw,72px);line-height:.97;letter-spacing:-.015em;max-width:14ch;text-wrap:balance}
html[dir="rtl"] h1{font-weight:700;line-height:1.22;letter-spacing:0;font-size:clamp(32px,5vw,56px)}
.lede{margin:0;font-size:17.5px;color:var(--muted);max-width:60ch}
.specs{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.specs li{font-family:var(--f-mono);font-size:12px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
html[dir="rtl"] .specs li{font-family:var(--f-body);font-size:13px}

/* notice */
.notice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin-bottom:26px}
.notice.ex{background:var(--accent-soft);border-color:transparent}
.notice p{margin:0;font-size:14px;min-width:0;flex:1 1 300px}
.notice-actions{display:flex;flex-wrap:wrap;gap:8px}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:32px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}}
.form{display:grid;gap:44px;min-width:0}
.part{display:grid;gap:14px}
.part-head{display:grid;gap:4px;margin-bottom:2px}
.part-no{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
h2{margin:0;font-family:var(--f-display);font-stretch:84%;font-weight:750;font-size:28px;line-height:1.1;text-wrap:balance}
html[dir="rtl"] h2{font-weight:700;line-height:1.4}
.part-sub{margin:0;color:var(--muted);font-size:14px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.span2{grid-column:1/-1}
@media (max-width:560px){.fields{grid-template-columns:minmax(0,1fr);padding:16px}}
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field label{font-size:13.5px;font-weight:600}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
input[type="text"],input[type="number"],select{font:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input[type="number"]{font-variant-numeric:tabular-nums}
input[type="range"]{width:100%;accent-color:var(--accent)}
.range-row{display:flex;align-items:center;gap:14px}
.range-out{font-family:var(--f-mono);font-size:15px;font-weight:500;min-width:4ch;text-align:end;font-variant-numeric:tabular-nums}
.calc-note{margin:0;font-size:12.5px;color:var(--muted)}

/* question cards */
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:12px}
@media (max-width:560px){.q{padding:16px}}
.q-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline}
.q-no{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--accent)}
.q h3{margin:0;font-family:var(--f-display);font-stretch:90%;font-weight:700;font-size:19px;line-height:1.25;text-wrap:balance}
html[dir="rtl"] .q h3{font-weight:600;line-height:1.55}
.q .why{grid-column:2;margin:0;font-size:13.5px;color:var(--muted)}
.opts{display:grid;gap:6px;margin:0;padding:0;border:0;min-width:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14.5px;background:var(--surface);transition:border-color .15s,background-color .15s}
.opt:hover{border-color:var(--muted)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt input{accent-color:var(--accent);margin:4px 0 0;flex:none}
.wf-pick{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.wf-pick .lbl{font-size:13.5px;font-weight:600;margin:0}
.wf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.wf-grid{grid-template-columns:minmax(0,1fr)}}
.opt.wf span{display:grid;gap:2px;min-width:0}
.opt.wf b{font-weight:600}
.opt.wf small{color:var(--muted);font-size:12.5px;line-height:1.45}

/* result panel */
.panel{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px;min-width:0;scroll-margin-top:16px}
@media (max-width:960px){.panel{position:static}}
.panel-head{display:flex;justify-content:space-between;gap:8px}
.score-row{display:flex;gap:16px;align-items:center}
.ring{width:112px;height:112px;flex:none;direction:ltr}
.ring-bg{fill:none;stroke:var(--line);stroke-width:10}
.ring-fg{fill:none;stroke:var(--muted);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .5s ease}
.ring.good .ring-fg{stroke:var(--good)} .ring.warn .ring-fg{stroke:var(--warn)} .ring.crit .ring-fg{stroke:var(--crit)}
.ring-num{font-family:var(--f-display);font-size:36px;font-weight:800;fill:var(--ink);font-variant-numeric:tabular-nums}
.ring-sub{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.score-text{display:grid;gap:6px;min-width:0}
.score-text p{margin:0;font-size:13.5px;color:var(--muted)}
.pill{justify-self:start;display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.acc{background:var(--accent);color:var(--accent-ink);font-size:11px;padding:2px 8px;margin-inline-start:6px;vertical-align:middle}
.radar{margin:0;display:grid;gap:4px;border-top:1px solid var(--line);padding-top:14px}
.radar svg{width:100%;max-width:330px;height:auto;display:block;margin-inline:auto;direction:ltr}
.radar figcaption{font-size:12px;color:var(--muted);text-align:center}
.rg{fill:none;stroke:var(--line);stroke-width:1}
.rax{stroke:var(--line);stroke-width:1}
.rdata{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.rdot{fill:var(--accent)}
.rlab{fill:var(--muted);font-family:var(--f-body);font-size:10.5px;font-weight:500}
.rlab.low{fill:var(--crit);font-weight:700}
.tier{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.tier-name{font-family:var(--f-display);font-stretch:82%;font-weight:800;font-size:32px;line-height:1}
html[dir="rtl"] .tier-name{font-weight:700;line-height:1.3;font-size:28px}
.tier-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.tier-meta div{background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}
.tier-meta dt{font-size:11.5px;color:var(--muted)}
.tier-meta dd{margin:0;font-family:var(--f-mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
html[dir="rtl"] .tier-meta dd{font-family:var(--f-body);font-weight:600}
.reasons{margin:0;padding-inline-start:18px;font-size:13px;color:var(--muted);display:grid;gap:3px}
.roi{border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.stat{display:grid;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-family:var(--f-display);font-stretch:88%;font-weight:750;font-size:25px;line-height:1.1;font-variant-numeric:tabular-nums}
.roi .muted{grid-column:1/-1;font-size:13px}
.warnbox{font-size:13px;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;margin:0}
.to-brief{font-weight:600;font-size:14px;text-decoration:none}
.to-brief:hover{text-decoration:underline}

/* brief */
.brief{padding-block:64px 24px;display:grid;gap:20px;scroll-margin-top:8px}
.brief-head{display:grid;gap:6px}
.brief h2{font-size:clamp(28px,4vw,42px)}
.brief-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:820px){.brief-grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:12px;align-content:start;min-width:0}
@media (max-width:560px){.card{padding:16px}}
.card.wide{grid-column:1/-1}
.card h3{margin:0;font-family:var(--f-display);font-stretch:90%;font-weight:700;font-size:20px;line-height:1.25}
html[dir="rtl"] .card h3{font-weight:600}
.card p{margin:0}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}
.muted{color:var(--muted);margin:0}
.gaps{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.gaps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.gaps p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.chip{font-family:var(--f-mono);font-size:12px;font-weight:500;padding:3px 7px;border-radius:6px;font-variant-numeric:tabular-nums;direction:ltr}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.wf-name{font-family:var(--f-display);font-stretch:82%;font-weight:800;font-size:28px;line-height:1.08}
html[dir="rtl"] .wf-name{font-weight:700;line-height:1.35;font-size:24px}
.proof{background:var(--surface-2);border-radius:8px;padding:12px 14px;display:grid;gap:4px}
.proof p{font-size:14px}
.mini{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted)}
.mini b{color:var(--ink);font-variant-numeric:tabular-nums}
.phases{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.phases li{position:relative;display:grid;gap:4px;align-content:start;padding-block:16px 4px;padding-inline:0 16px;border-top:2px solid var(--line);min-width:0}
.phases li::before{content:"";position:absolute;top:-6px;inset-inline-start:0;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.phases strong{font-size:14.5px;line-height:1.3}
.phases p{font-size:13px;color:var(--muted)}
@media (max-width:900px){
  .phases{grid-template-columns:minmax(0,1fr)}
  .phases li{border-top:0;border-inline-start:2px solid var(--line);padding-block:0 18px;padding-inline:18px 0}
  .phases li::before{top:3px;inset-inline-start:-6px}
}
.fine{margin:0;font-size:12.5px;color:var(--muted)}
.handoff{margin:0;font-family:var(--f-mono);font-size:12.5px;line-height:1.65;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
html[dir="rtl"] .handoff{font-family:var(--f-body);font-size:13.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.table-scroll{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
th,td{text-align:start;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-size:11.5px;font-weight:600;color:var(--muted)}
tbody th{font-weight:700;white-space:nowrap}
td.num{font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
html[dir="rtl"] td.num{font-family:var(--f-body)}
tr.rec{background:var(--accent-soft)}

/* footer + mobile bar */
.foot{margin-top:24px;padding-block:24px 40px;border-top:1px solid var(--line);display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.foot p{margin:0}
.mbar{display:none}
@media (max-width:960px){
  .foot{padding-bottom:110px}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));font-size:13.5px}
  .mbar span{min-width:0}
  .mbar b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
  .mbar a{font-weight:600;text-decoration:none;white-space:nowrap}
}

/* builder's note */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(700px, calc(100% - 32px));max-height:calc(100% - 48px)}
dialog::backdrop{background:rgba(6,10,16,.55)}
.note-in{padding:26px;display:grid;gap:12px}
@media (max-width:560px){.note-in{padding:18px}}
.note-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.icon-btn{font:inherit;font-size:24px;line-height:1;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px}
.icon-btn:hover{color:var(--ink)}
dialog h2{font-size:28px}
dialog h3{margin:10px 0 0;font-size:15px;font-weight:700}
dialog p{margin:0}
dialog ul{margin:0;padding-inline-start:20px;display:grid;gap:6px;font-size:14.5px}
.days{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14.5px}
.days li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;align-items:baseline}
.about{border-top:1px solid var(--line);padding-top:14px;margin-top:8px;display:grid;gap:5px}
.about strong{font-size:16px}
.about p{font-size:14px;color:var(--muted)}
.contact{display:flex;flex-wrap:wrap;gap:4px 20px;font-family:var(--f-mono);font-size:13.5px;color:var(--ink)!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important} html{scroll-behavior:auto}}
</style>

  {id:'1', en:'One', ar:'واحد'},

  {id:'4+', en:'Four or more', ar:'أربعة أو أكثر'}

const t = k => (S[k] ? S[k][lang] : k);
const tx = o => (o ? o[lang] : '');
const fmt = n => new Intl.NumberFormat('en-US').format(n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => lang === 'ar' ? `${fmt(n)} درهم` : `AED ${fmt(n)}`;
const WF = id => WORKFLOWS.find(w => w.id === id) || null;
const find = (list, id) => list.find(x => x.id === id) || null;

function exampleState(){
  return {company:'', sector:'logistics', size:'s21', wfCount:'1', systems:'1',
    q:{q1:'c', q2:'b', q3:'c', q4:'b', q5:'cloud', q6:'b', q7:'b'},
    workflow:'docs', people:4, hours:15, rate:70, share:50, shareTouched:false};
}
function blankState(){
  return {company:'', sector:'', size:'', wfCount:'', systems:'', q:{}, workflow:null,
    people:null, hours:null, rate:null, share:40, shareTouched:false};
}
let state = exampleState();
let isExample = true;

/* ---------- scoring ---------- */
function computeTier(){
  let lvl = 0; const r = [];
  const bump = (l, k) => { if (l > lvl) lvl = l; r.push(k); };
  if (state.systems === '2-3') bump(1, 'r_sys23');
  if (state.systems === '4-6' || state.systems === '7+') bump(2, 'r_sys4');
  if (state.wfCount === '2-3') bump(1, 'r_wf23');
  if (state.wfCount === '4+') bump(2, 'r_wf4');
  if (state.size === 's201') bump(1, 'r_size201');
  if (state.size === 's1000') bump(2, 'r_size1000');
  if (state.sector === 'gov') bump(3, 'r_gov');
  if (state.q.q5 === 'airgap') bump(3, 'r_airgap');
  const missing = !state.systems || !state.wfCount || !state.size;
  if (!r.length && !missing) r.push('r_compact');
  if (missing) r.push('r_pending');
  return {tier: TIERS[lvl], reasons: r};
}
function computeROI(tier){
  const p = state.people, h = state.hours, rate = state.rate, share = state.share;
  if (!(p > 0 && h > 0 && rate > 0 && share > 0)) return null;
  const annual = p * h * 48;
  const freed = annual * share / 100;
  const value = Math.round(freed * rate / 100) * 100;
  const perMonth = (freed * rate) / 12;
  const pbLo = Math.max(1, Math.round(tier.lo / perMonth));
  const pbHi = tier.hi ? Math.max(1, Math.round(tier.hi / perMonth)) : null;
  return {annual, freed: Math.round(freed), value, fte: freed / 1920, pbLo, pbHi};
}
function compute(){
  const scores = QUESTIONS.map(q => {
    const o = q.opts.find(o => o.id === state.q[q.id]);
    return o ? o.s : null;
  });
  const answered = scores.filter(s => s != null).length;
  const total = scores.reduce((a, s) => a + (s || 0), 0);
  const score = answered === 7 ? Math.round(total / 21 * 100) : null;
  const band = score == null ? null : score < 40 ? 'low' : score < 70 ? 'mid' : 'high';
  const tr = computeTier();
  const roi = computeROI(tr.tier);
  const gaps = QUESTIONS.map((q, i) => ({q, s: scores[i]})).filter(g => g.s != null && g.s <= 1).sort((a, b) => a.s - b.s);
  return {scores, answered, score, band, tier: tr.tier, reasons: tr.reasons, roi, gaps};
}
const bandCls = b => b === 'low' ? 'crit' : b === 'mid' ? 'warn' : b === 'high' ? 'good' : '';
function pbText(r){
  if (!r) return '—';
  if (r.pbHi == null) return `${t('from')} ${r.pbLo}`;
  if (r.pbLo === r.pbHi) return `${r.pbLo}`;
  return lang === 'ar' ? `من ${r.pbLo} إلى ${r.pbHi}` : `${r.pbLo}–${r.pbHi}`;
}

      ${q.opts.map(o => `<label class="opt" for="${q.id}-${o.id}"><input type="radio" name="${q.id}" id="${q.id}-${o.id}" value="${o.id}"><span>${tx(o)}</span></label>`).join('')}

  </div>`;

function radarSVG(scores){
  const N = 7, R = 80;
  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / N; return [r * Math.cos(a), r * Math.sin(a)]; };
  const f = p => p.map(v => v.toFixed(1)).join(',');
  let s = '';
  for (let k = 1; k <= 3; k++) s += `<polygon class="rg" points="${Array.from({length: N}, (_, i) => f(pt(i, R * k / 3))).join(' ')}"/>`;
  for (let i = 0; i < N; i++){ const [x, y] = pt(i, R); s += `<line class="rax" x1="0" y1="0" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }
  const dp = scores.map((v, i) => pt(i, R * (v || 0) / 3));
  if (scores.some(v => v != null)) s += `<polygon class="rdata" points="${dp.map(f).join(' ')}"/>`;
  scores.forEach((v, i) => { if (v != null){ const [x, y] = dp[i]; s += `<circle class="rdot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"/>`; } });
  QUESTIONS.forEach((q, i) => {
    const [x, y] = pt(i, R + 14);
    const anchor = Math.abs(x) < 8 ? 'middle' : x > 0 ? 'start' : 'end';
    const dy = y < -R * 0.6 ? -2 : y > R * 0.6 ? 10 : 4;
    const cls = scores[i] != null && scores[i] <= 1 ? 'rlab low' : 'rlab';
    s += `<text class="${cls}" x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anchor}">${tx(q.axis)}</text>`;
  });
  return `<svg viewBox="-165 -112 330 224" role="img" aria-label="${t('radar_aria')}">${s}</svg>`;
}

function handoffText(c){
  const none = t('not_given');
  const L = (k, v) => `${t(k)}: ${v}`;
  const wf = WF(state.workflow);
  const sec = find(SECTORS, state.sector), size = find(SIZES, state.size), sys = find(SYSTEMS, state.systems), wfc = find(WFCOUNT, state.wfCount);
  const q5 = QUESTIONS[4].opts.find(o => o.id === state.q.q5);
  const prio = c.score == null ? t('pr_pending') : c.band === 'high' ? t('pr_a') : c.band === 'mid' ? t('pr_b') : t('pr_c');
  const next = c.band === 'high' ? t('next_high').replace('{t}', tx(c.tier.name)) : c.band === 'mid' ? t('next_mid') : t('next_low');
  return [
    t('h_title'), '',
    L('h_company', state.company.trim() || none),
    L('h_sector', sec ? tx(sec) : none),
    L('h_team', size ? tx(size) : none),
    L('h_ready', c.score == null ? t('h_incomplete').replace('{n}', c.answered) : `${c.score}/100 · ${t('band_' + c.band)}`),
    L('h_wf', wf ? tx(wf.name) : none),
    L('h_systems', sys ? tx(sys) : none),
    L('h_wfcount', wfc ? tx(wfc) : none),
    L('h_data', q5 ? tx(q5) : none),
    L('h_gaps', c.gaps.length ? c.gaps.map(g => tx(g.q.short)).join(t('sep')) : t('h_nogaps')),
    L('h_scope', `${tx(c.tier.name)} · ${tx(c.tier.time)} · ${tx(c.tier.inv)}`),
    L('h_value', c.roi ? `${fmt(c.roi.freed)} ${t('h_hours')} ≈ ${money(c.roi.value)}` : none),
    L('h_priority', prio),
    L('h_next', next)
  ].join('\n');
}

/* ---------- render ---------- */
const app = $('#app');
function renderApp(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  app.innerHTML = `
  <header class="topbar"><div class="wrap topbar-in">

    <div class="top-actions">
      <button type="button" class="btn outline" id="btnNote">${t('note_btn')}</button>
      <button type="button" class="btn ghost" id="btnLang" lang="${lang === 'en' ? 'ar' : 'en'}">${lang === 'en' ? 'عربي' : 'English'}</button>

  <section class="hero wrap">

    <div class="notice" id="notice"><p id="noticeText"></p>

            <div class="field span2"><label for="f-company">${t('company')}</label><input id="f-company" data-field="company" type="text" autocomplete="organization" maxlength="80" placeholder="${t('company_ph')}"></div>
            ${selectField('f-sector', 'sector', t('sector'), SECTORS)}
            ${selectField('f-size', 'size', t('size'), SIZES)}
            ${selectField('f-wfcount', 'wfCount', t('wfcount'), WFCOUNT)}

          </div>
        </section>
        <section class="part" aria-labelledby="p2h">
          <div class="part-head"><span class="part-no">2 / 3</span><h2 id="p2h">${t('p2')}</h2><p class="part-sub">${t('p2_sub')}</p></div>
          ${QUESTIONS.map(questionHTML).join('')}
        </section>
        <section class="part" aria-labelledby="p3h">
          <div class="part-head"><span class="part-no">3 / 3</span><h2 id="p3h">${t('p3')}</h2><p class="part-sub">${t('p3_sub')}</p></div>
          <div class="fields">
            ${numberField('f-people', 'people', t('people'), 1, 1000, 1)}
            ${numberField('f-hours', 'hours', t('hours'), 1, 60, 1)}
            ${numberField('f-rate', 'rate', t('rate'), 10, 2000, 5)}
            <div class="field"><label for="f-share">${t('share')}</label>
              <div class="range-row"><input id="f-share" data-field="share" type="range" min="10" max="80" step="5"><output class="range-out" id="shareOut" for="f-share"></output></div>
              <p class="hint" id="shareHint"></p></div>

      <aside class="panel" id="result"></aside>
    </div>
  </div>
  <section class="brief wrap" id="brief" aria-labelledby="briefh"></section>
  <footer class="foot wrap"><p>${t('foot1')}</p><p>${t('foot2')} <a href="https://hashinclu.de/en/" target="_blank" rel="noopener">hashinclu.de</a></p></footer>
  <div class="mbar" id="mbar"></div>`;
  $('#note').innerHTML = noteHTML();
  // restore values
  $('#f-company').value = state.company;
  $('#f-sector').value = state.sector;
  $('#f-size').value = state.size;
  $('#f-wfcount').value = state.wfCount;
  $('#f-systems').value = state.systems;
  $('#f-people').value = state.people ?? '';
  $('#f-hours').value = state.hours ?? '';
  $('#f-rate').value = state.rate ?? '';
  $('#f-share').value = state.share;
  QUESTIONS.forEach(q => { const el = document.getElementById(`${q.id}-${state.q[q.id]}`); if (el) el.checked = true; syncOn(q.id); });
  if (state.workflow){ const el = document.getElementById(`wf-${state.workflow}`); if (el) el.checked = true; }
  syncOn('workflow');
  updateNotice(); updateShare(); renderResults();
}
function syncOn(name){
  document.querySelectorAll(`input[name="${name}"]`).forEach(i => i.closest('label').classList.toggle('on', i.checked));
}
function updateNotice(){
  const n = $('#notice'); if (!n) return;
  n.classList.toggle('ex', isExample);
  $('#noticeText').textContent = isExample ? t('ex_note') : t('own_note');
}
function updateShare(){
  $('#shareOut').textContent = `${state.share}%`;
  const wf = WF(state.workflow);
  $('#shareHint').textContent = wf ? t('share_hint').replace('{w}', tx(wf.name)) : t('share_hint_none');
}
function renderResults(){
  const c = compute();
  $('#result').innerHTML = panelHTML(c);
  $('#brief').innerHTML = briefHTML(c);
  $('#handoff').textContent = handoffText(c);
  $('#mbar').innerHTML = mbarHTML(c);
}

/* ---------- events ---------- */
function onInput(e){
  const el = e.target;
  if (el.type === 'radio' && el.name){
    if (el.name === 'workflow'){
      state.workflow = el.value;
      if (!state.shareTouched){ state.share = WF(el.value).share; $('#f-share').value = state.share; }
    } else {
      state.q[el.name] = el.value;
    }
    syncOn(el.name);
  } else if (el.dataset && el.dataset.field){
    const f = el.dataset.field;
    if (f === 'people' || f === 'hours' || f === 'rate' || f === 'share'){
      const v = el.value === '' ? null : Number(el.value);
      state[f] = (v == null || isNaN(v)) ? null : v;
      if (f === 'share') state.shareTouched = true;
    } else {
      state[f] = el.value;
    }
  } else return;
  if (isExample){ isExample = false; updateNotice(); }
  updateShare();
  renderResults();
}
app.addEventListener('input', onInput);
app.addEventListener('change', onInput);
app.addEventListener('submit', e => e.preventDefault());
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'btnLang'){
    lang = lang === 'en' ? 'ar' : 'en';
    try { localStorage.setItem('arc-lang', lang); } catch (_) {}
    renderApp();
  } else if (b.id === 'btnNote'){ openNote(); }
  else if (b.id === 'btnBlank'){ state = blankState(); isExample = false; renderApp(); }
  else if (b.id === 'btnExample'){ state = exampleState(); isExample = true; renderApp(); }
  else if (b.id === 'btnCopy'){ copyHandoff(); }
  else if (b.id === 'btnBook'){ $('#copyMsg').textContent = t('book_note'); }
});
function copyHandoff(){
  const pre = $('#handoff'), msg = $('#copyMsg');
  const fallback = () => {
    try { const r = document.createRange(); r.selectNodeContents(pre); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (_) {}
    msg.textContent = t('copy_fail');
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(pre.textContent).then(() => { msg.textContent = t('copied'); }, fallback);
    } else fallback();
  } catch (_) { fallback(); }
}
const note = $('#note');
function openNote(){
  try { if (typeof note.showModal === 'function') note.showModal(); else note.setAttribute('open', ''); }
  catch (_) { note.setAttribute('open', ''); }
}
function closeNote(){
  if (typeof note.close === 'function') note.close(); else note.removeAttribute('open');
}
note.addEventListener('click', e => {
  if (e.target === note || e.target.closest('#btnClose')) closeNote();
});

renderApp();
if (location.hash === '#note') openNote();
})();
</script>
